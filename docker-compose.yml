version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: ia-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: IAgentDb
    volumes:
      - ./data/db:/data/db
    ports:
      - 27017:27017

  api:
    build:
      context: .
      dockerfile: /IAgent.API/Dockerfile
    container_name: ia-api
    restart: on-failure
    ports:
      - 5000:80
    depends_on:
      - mongo
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mongo: "mongodb://admin:secret@mongo:27017/IAgentDb?authSource=admin"
      Kafka__BootstrapServers: "kafka:9092"

  billing:
    build:
      context: .
      dockerfile: /Billing.API/Dockerfile
    container_name: ia-billing
    restart: on-failure
    depends_on:
      - kafka
      - mongo
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mongo: "mongodb://admin:secret@mongo:27017/BillingDb?authSource=admin"
      Kafka__BootstrapServers: "kafka:9092"


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    volumes:
      - ./data/zookeeper:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ia-kafka
    depends_on: 
      - zookeeper
    ports:
    - 9092:9092
    - 29092:29092
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
